<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="peachGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff69b4"/>
      <stop offset="100%" style="stop-color:#ff1493"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Peach/Ass shape -->
  <ellipse cx="24" cy="35" rx="18" ry="22" fill="url(#peachGrad)" filter="url(#glow)"/>
  <ellipse cx="40" cy="35" rx="18" ry="22" fill="url(#peachGrad)" filter="url(#glow)"/>
  
  <!-- Center line -->
  <path d="M32 15 Q32 35 32 55" stroke="#ff00ff" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Highlight -->
  <ellipse cx="20" cy="28" rx="6" ry="8" fill="white" opacity="0.3"/>
  <ellipse cx="44" cy="28" rx="6" ry="8" fill="white" opacity="0.3"/>
</svg>
